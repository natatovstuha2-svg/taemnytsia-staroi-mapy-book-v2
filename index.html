<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таємниця старої мапи — тест геометрії книги</title>

<style>
:root{
  --bg:#eef7f8;
}

*{box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body{
  background:var(--bg);
  font-family:"Nunito Sans","Segoe UI",Arial,sans-serif;
}

.reader{
  width:100%;
  height:100dvh;
  display:grid;
  place-items:center;
  padding:6px;
}

.stage{
  position:relative;
  width:min(96vw, calc(94dvh * 1.5));
  max-width:1536px;
  aspect-ratio:3/2;
  perspective:2600px;
  isolation:isolate;
}

/* Нерухома основа книги */
.base{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  user-select:none;
  pointer-events:none;
  filter:drop-shadow(0 16px 28px rgba(20,45,50,.18));
  z-index:1;
}

/*
  ВАЖЛИВО:
  Це реальна внутрішня зона сторінок,
  виміряна від нашого 01_book_spread.png.
  Вона майже повністю заповнює паперовий блок книги,
  але не залазить на синю палітурку.
*/
#book{
  position:absolute;
  left:4.25%;
  top:2.45%;
  width:91.50%;
  height:93.10%;
  z-index:10;
}

/* Сторінки */
.page{
  overflow:hidden;
  background:#fff;
}

.paper{
  width:100%;
  height:100%;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.020),
      transparent 6%,
      transparent 94%,
      rgba(0,0,0,.014)
    ),
    #fff;
}

/* Обкладинка */
.cover{
  width:100%;
  height:100%;
  background:transparent;
  display:grid;
  place-items:center;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  user-select:none;
  pointer-events:none;
}

/* Невидимі активні кутики */
.corner{
  position:absolute;
  width:8%;
  height:11%;
  border:0;
  padding:0;
  background:transparent;
  z-index:80;
  cursor:pointer;
}

.corner.next.top{right:4.25%;top:2.45%}
.corner.next.bottom{right:4.25%;bottom:4.45%}
.corner.prev.top{left:4.25%;top:2.45%}
.corner.prev.bottom{left:4.25%;bottom:4.45%}

.corner[hidden]{display:none}

/* маленька підказка, без крапок на сторінках */
.note{
  position:absolute;
  left:50%;
  bottom:-28px;
  transform:translateX(-50%);
  color:#60716d;
  font-size:12px;
  white-space:nowrap;
  user-select:none;
}

@media(max-width:760px){
  .stage{
    width:min(98vw, calc(95dvh * 1.5));
  }

  .note{
    font-size:10px;
    bottom:-23px;
  }
}
</style>
</head>

<body>
<main class="reader">

  <section class="stage">

    <img
      class="base"
      src="01_book_spread.png"
      alt=""
      aria-hidden="true"
    >

    <div id="book">

      <div class="page" data-density="hard">
        <div class="cover">
          <img src="04_cover_front.png" alt="Обкладинка книги">
        </div>
      </div>

      <div class="page" data-density="soft"><div class="paper"></div></div>
      <div class="page" data-density="soft"><div class="paper"></div></div>
      <div class="page" data-density="soft"><div class="paper"></div></div>
      <div class="page" data-density="soft"><div class="paper"></div></div>
      <div class="page" data-density="soft"><div class="paper"></div></div>
      <div class="page" data-density="soft"><div class="paper"></div></div>

    </div>

    <button class="corner next top" id="nextTop" aria-label="Наступна сторінка"></button>
    <button class="corner next bottom" id="nextBottom" aria-label="Наступна сторінка"></button>
    <button class="corner prev top" id="prevTop" aria-label="Попередня сторінка" hidden></button>
    <button class="corner prev bottom" id="prevBottom" aria-label="Попередня сторінка" hidden></button>

    <div class="note">Гортай за верхній або нижній кутик сторінки</div>

  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const pageFlip = new St.PageFlip(
    document.getElementById("book"),
    {
      /*
        Співвідношення сторінки ~ 0.73.
        Це відповідає реальній геометрії нашого відкритого розвороту.
      */
      width: 700,
      height: 960,

      size: "stretch",
      minWidth: 280,
      maxWidth: 700,
      minHeight: 384,
      maxHeight: 960,

      autoSize: false,
      showCover: true,
      usePortrait: true,

      drawShadow: true,
      maxShadowOpacity: 0.32,
      flippingTime: 1500,

      useMouseEvents: true,
      mobileScrollSupport: false,
      swipeDistance: 25,

      disableFlipByClick: true,
      startPage: 0
    }
  );

  pageFlip.loadFromHTML(
    document.querySelectorAll("#book .page")
  );

  const nextTop = document.getElementById("nextTop");
  const nextBottom = document.getElementById("nextBottom");
  const prevTop = document.getElementById("prevTop");
  const prevBottom = document.getElementById("prevBottom");

  function updateCorners(){
    const index = pageFlip.getCurrentPageIndex();
    const total = pageFlip.getPageCount();

    const canPrev = index > 0;
    const canNext = index < total - 1;

    prevTop.hidden = !canPrev;
    prevBottom.hidden = !canPrev;
    nextTop.hidden = !canNext;
    nextBottom.hidden = !canNext;
  }

  nextTop.addEventListener("click", () => pageFlip.flipNext("top"));
  nextBottom.addEventListener("click", () => pageFlip.flipNext("bottom"));
  prevTop.addEventListener("click", () => pageFlip.flipPrev("top"));
  prevBottom.addEventListener("click", () => pageFlip.flipPrev("bottom"));

  pageFlip.on("flip", updateCorners);
  pageFlip.on("changeOrientation", updateCorners);

  window.addEventListener("keydown", event => {
    if(event.key === "ArrowRight") pageFlip.flipNext("bottom");
    if(event.key === "ArrowLeft") pageFlip.flipPrev("bottom");
  });

  updateCorners();
});
</script>

</body>
</html>
