<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Таємниця старої мапи</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #dfe9eb;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: #17394a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 14px 28px;
    }

    .reader {
      width: min(96vw, 1500px);
    }

    .book-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      user-select: none;
    }

    .underlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .cover-stage,
    .spread-stage {
      position: absolute;
      inset: 0;
    }

    .hidden {
      display: none !important;
    }

    .cover-stage {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-image {
      width: min(36%, 430px);
      max-height: 88%;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.18));
    }

    .spread-canvas {
      position: absolute;
      left: 4.5%;
      top: 4.2%;
      width: 91%;
      height: 85.8%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 3%;
    }

    .page {
      position: relative;
      overflow: hidden;
      padding: 3.8% 6.2% 4.5%;
      display: flex;
      flex-direction: column;
      background: transparent;
    }

    .page-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .valley-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 52%;
      object-fit: cover;
      opacity: 0.92;
      pointer-events: none;
      z-index: 1;
    }

    .title {
      margin: 0 0 2px;
      font-size: clamp(18px, 2vw, 31px);
      line-height: 1.1;
      font-weight: 700;
      color: #0b7d7d;
    }

    .text {
      font-size: clamp(14px, 1.45vw, 19px);
      line-height: 1.48;
      font-weight: 400;
    }

    .text p {
      margin: 0 0 12px;
    }

    .page-image {
      margin-top: auto;
      align-self: center;
      width: 88%;
      max-height: 46%;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      background: rgba(255,255,255,0.75);
    }

    .page-image.small {
      width: 78%;
      max-height: 31%;
    }

    .questions ol {
      margin: 10px 0 0;
      padding-left: 24px;
    }

    .questions li {
      margin-bottom: 8px;
    }

    .page-number {
      position: absolute;
      bottom: 2%;
      font-size: clamp(12px, 1vw, 17px);
      color: #758489;
      z-index: 3;
    }

    .page.left .page-number { left: 6%; }
    .page.right .page-number { right: 6%; }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      background: #0b8d8d;
      color: #fff;
      font-size: 20px;
      line-height: 1;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.2s ease;
      box-shadow: 0 6px 14px rgba(0,0,0,0.12);
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: #097d7d;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
      box-shadow: none;
    }

    .indicator {
      min-width: 120px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #35535f;
    }

    .hint {
      margin: 12px 0 0;
      text-align: center;
      font-size: 15px;
      color: #4e6a73;
    }

    .fade-in {
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 950px) {
      .spread-canvas {
        left: 5.2%;
        top: 4.2%;
        width: 89.6%;
        height: 85.3%;
        column-gap: 2.4%;
      }

      .page {
        padding: 3.5% 5.2% 4.8%;
      }

      .page-image {
        width: 92%;
        max-height: 41%;
      }

      .indicator {
        font-size: 18px;
      }

      button {
        font-size: 18px;
        padding: 12px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="reader">
    <div class="book-stage">
      <img id="underlay" class="underlay" src="00_book_start.png" alt="Книга" />

      <div id="coverStage" class="cover-stage fade-in">
        <img class="cover-image" src="04_cover_front.png" alt="Обкладинка книги" />
      </div>

      <div id="spreadStage" class="spread-stage hidden">
        <div class="spread-canvas fade-in">
          <section id="leftPage" class="page left"></section>
          <section id="rightPage" class="page right"></section>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="prevBtn">← Назад</button>
      <div id="indicator" class="indicator">Обкладинка</div>
      <button id="nextBtn">Далі →</button>
    </div>

    <p class="hint">Книга-макет завжди залишається внизу, а зверху змінюється тільки вміст сторінок.</p>
  </div>

  <script>
    const spreads = [
      {
        left: {
          image: "05_scene_01_map_found.png",
          paragraphs: [
            "Одного сонячного дня Сашко й Дмитро гуляли біля річки. Під корінням старої верби вони знайшли пожовклий згорток — стару мапу.",
            "На ній тягнулася звивиста річка, а тонка стежка вела до невідомої долини. Хлопці перезирнулися: попереду чекала пригода."
          ]
        },
        right: {
          image: "06_scene_02_boat_route.png",
          paragraphs: [
            "Біля берега стояв дерев’яний човен. Друзі сіли в нього й попливли за маршрутом, позначеним на мапі.",
            "Спочатку річка була широкою і спокійною, та згодом береги стали вищими, а попереду між скелями відкрився вузький прохід."
          ]
        }
      },
      {
        left: {
          image: "07_scene_03_ravine_arrival.png",
          paragraphs: [
            "Незабаром хлопці пристали до берега. Вони витягли човен на сушу й рушили стежкою крізь густі хащі.",
            "Десь унизу чулося дзюрчання води, а попереду відкривалася тиха зелена долина."
          ]
        },
        right: {
          image: "08_scene_04_old_oak.png",
          paragraphs: [
            "За камінням вони побачили велетенський дуб. Його стовбур був таким широким, що Сашко й Дмитро навряд чи змогли б обійняти його вдвох.",
            "Дуб здавався дуже старим, сильним і мудрим."
          ]
        }
      },
      {
        left: {
          image: "09_scene_05_oak_problem.png",
          paragraphs: [
            "Та радість швидко змінилася тривогою. Частина листя на дубі вже тьмяніла, а біля коріння земля була сухою.",
            "Друзі зрозуміли: дереву потрібна допомога."
          ]
        },
        right: {
          image: "10_scene_06_spring_found.png",
          paragraphs: [
            "Обійшовши схил, хлопці знайшли неподалік маленьке джерело. Вода була чиста й холодна.",
            "Здавалося, саме воно колись живило землю біля старого дуба."
          ]
        }
      },
      {
        left: {
          image: "11_scene_07_spring_blocked.png",
          paragraphs: [
            "Але вода ледве просочувалася крізь завал із гілок, листя й камінців. Джерело було майже перекрите.",
            "Через це волога майже не доходила до коріння дуба."
          ]
        },
        right: {
          image: "12_scene_08_spring_cleaning.png",
          paragraphs: [
            "Сашко і Дмитро обережно почали розчищати струмок. Вони прибирали мокре листя, дрібні гілки й усе, що заважало воді.",
            "Робота була нелегка, але друзі не здавалися."
          ]
        }
      },
      {
        left: {
          image: "13_scene_09_water_flows.png",
          paragraphs: [
            "Нарешті вода побігла вільніше. Струмок заіскрився на сонці, задзюрчав голосніше й потік униз до долини.",
            "Хлопці зраділи: джерело знову ожило."
          ]
        },
        right: {
          image: "14_scene_10_oak_recovery.png",
          paragraphs: [
            "Минуло трохи часу, і дуб наче ожив разом зі струмком. Листя стало свіжішим, а гілки знову зашелестіли від легкого вітру.",
            "Добра справа дала свої плоди."
          ]
        }
      },
      {
        left: {
          image: "15_scene_11_true_treasure.png",
          paragraphs: [
            "Тоді друзі зрозуміли: справжній скарб — це не золото і не коштовності.",
            "Справжній скарб — побачити проблему, не пройти повз і зробити щось добре власними руками."
          ]
        },
        right: {
          image: "16_book_end.png",
          paragraphs: [
            "Сашко тримав у руках згорнуту мапу, а Дмитро усміхнувся:",
            "— Схоже, вона й справді привела нас до скарбу.",
            "Друзі повернулися до берега щасливі, бо цього дня врятували частинку живої природи."
          ]
        }
      },
      {
        left: {
          image: "16_book_end.png",
          paragraphs: [
            "Пригода завершилася, але її головний урок залишився з героями назавжди.",
            "Справжня цінність — не в пошуках коштовностей, а в уважності, турботі й добрих вчинках."
          ]
        },
        right: {
          title: "Питання від головних героїв",
          image: "17_questions_from_heroes.png",
          imageClass: "small",
          paragraphs: [
            "Ми повернулися з пригоди. А тепер поміркуй разом із нами."
          ],
          questions: [
            "Де Сашко й Дмитро знайшли стару мапу?",
            "Куди привів їх маршрут?",
            "Чому старий дуб почав всихати?",
            "Що заважало джерелу живити дерево?",
            "Що зробили хлопці, щоб допомогти дубу?",
            "Чому добра справа виявилася справжнім скарбом?"
          ]
        }
      }
    ];

    let current = 0;

    const underlay = document.getElementById("underlay");
    const coverStage = document.getElementById("coverStage");
    const spreadStage = document.getElementById("spreadStage");
    const leftPage = document.getElementById("leftPage");
    const rightPage = document.getElementById("rightPage");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const indicator = document.getElementById("indicator");

    function renderPage(target, data, pageNumber, side) {
      const title = data.title ? `<h2 class="title">${data.title}</h2>` : "";
      const paragraphs = (data.paragraphs || [])
        .map(p => `<p>${p}</p>`)
        .join("");

      const questions = data.questions
        ? `<div class="questions"><ol>${data.questions.map(q => `<li>${q}</li>`).join("")}</ol></div>`
        : "";

      const image = data.image
        ? `<img class="page-image ${data.imageClass || ""}" src="${data.image}" alt="">`
        : "";

      target.innerHTML = `
        <img class="valley-overlay" src="18_page_overlay_valley.png" alt="">
        <div class="page-content">
          ${title}
          <div class="text">
            ${paragraphs}
            ${questions}
          </div>
          ${image}
        </div>
        <div class="page-number">${pageNumber}</div>
      `;
    }

    function updateView() {
      if (current === 0) {
        underlay.src = "00_book_start.png";
        coverStage.classList.remove("hidden");
        spreadStage.classList.add("hidden");
        indicator.textContent = "Обкладинка";
      } else {
        const spread = spreads[current - 1];
        const leftNumber = current * 2;
        const rightNumber = current * 2 + 1;

        underlay.src = "01_book_spread.png";
        coverStage.classList.add("hidden");
        spreadStage.classList.remove("hidden");

        renderPage(leftPage, spread.left, leftNumber, "left");
        renderPage(rightPage, spread.right, rightNumber, "right");

        indicator.textContent = `${current} / ${spreads.length}`;
      }

      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === spreads.length;
    }

    prevBtn.addEventListener("click", () => {
      if (current > 0) {
        current--;
        updateView();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (current < spreads.length) {
        current++;
        updateView();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" && current < spreads.length) {
        current++;
        updateView();
      }
      if (e.key === "ArrowLeft" && current > 0) {
        current--;
        updateView();
      }
    });

    updateView();
  </script>
</body>
</html>
